<NForm
    ref="formRef"
    :model="model"
    :rules="naiveRules"
    :label-width="labelWidth"
    :label-placement="labelPlacement"
    :size="size"
    :show-feedback="showFeedback"
    :disabled="disabled"
    @submit.prevent="handleSubmit"
  >
    <!-- Grouped layout -->
    <template v-if="groupedFields">
      <div v-for="gf in groupedFields" :key="gf.group.key" class="r-form-group">
        <slot name="groupHeader" :group="gf.group">
          <div class="r-form-group__header" :class="{ collapsible: gf.group.collapsible }">
            <button
              v-if="gf.group.collapsible"
              class="r-form-group__toggle"
              type="button"
              :aria-expanded="!gf.collapsed"
              @click="toggleGroup(gf.group.key)"
            >
              <span class="r-form-group__arrow" :class="{ collapsed: gf.collapsed }">&#9660;</span>
            </button>
            <h4 class="r-form-group__title">{{ gf.group.title }}</h4>
          </div>
          <p v-if="gf.group.description && !gf.collapsed" class="r-form-group__desc">
            {{ gf.group.description }}
          </p>
        </slot>
        <NGrid v-if="!gf.collapsed" :cols="cols" :x-gap="columnGap" :y-gap="rowGap">
          <NFormItemGi
            v-for="field in gf.fields"
            :key="field.key"
            :label="field.label"
            :path="field.key"
            :span="field.span ?? 1"
          >
            <slot name="fieldPrefix" :field="field" />
            <component :is="'span'" v-if="asyncLoadingMap[field.key]" class="r-form-async-hint"
              >Loading...</component
            >
            <template v-else>
              <NInput
                v-if="field.type === 'input'"
                :value="fieldStr(field.key)"
                :type="field.inputType || 'text'"
                :placeholder="field.placeholder"
                :disabled="isFieldDisabled(field)"
                :readonly="readonly"
                :clearable="isFieldClearable(field)"
                @update:value="updateField(field.key, $event)"
              />
              <RTextareaField
                v-else-if="field.type === 'textarea'"
                :field="field"
                :model-value="model[field.key]"
                :disabled="isFieldDisabled(field)"
                :readonly="readonly"
                :clearable="isFieldClearable(field)"
                @update:model-value="updateField(field.key, $event)"
              />
              <NInputNumber
                v-else-if="field.type === 'number'"
                :value="fieldNum(field.key)"
                :placeholder="field.placeholder"
                :disabled="isFieldDisabled(field)"
                :readonly="readonly"
                :clearable="isFieldClearable(field)"
                style="width: 100%"
                @update:value="updateField(field.key, $event)"
              />
              <NSelect
                v-else-if="field.type === 'select'"
                :value="fieldStrNum(field.key)"
                :placeholder="field.placeholder"
                :disabled="isFieldDisabled(field)"
                :options="resolvedOptions(field)"
                :clearable="isFieldClearable(field)"
                @update:value="updateField(field.key, $event)"
              />
              <NRadioGroup
                v-else-if="field.type === 'radio'"
                :value="fieldStrNum(field.key)"
                :disabled="isFieldDisabled(field)"
                @update:value="updateField(field.key, $event)"
              >
                <NRadio
                  v-for="opt in field.options ?? []"
                  :key="String(opt.value)"
                  :value="toStrNum(opt.value)"
                  :disabled="opt.disabled"
                  >{{ opt.label }}</NRadio
                >
              </NRadioGroup>
              <NCheckboxGroup
                v-else-if="field.type === 'checkbox'"
                :value="fieldArr(field.key)"
                :disabled="isFieldDisabled(field)"
                @update:value="updateField(field.key, $event)"
              >
                <NCheckbox
                  v-for="opt in field.options ?? []"
                  :key="String(opt.value)"
                  :value="toStrNum(opt.value)"
                  :disabled="opt.disabled"
                  :label="opt.label"
                />
              </NCheckboxGroup>
              <NSwitch
                v-else-if="field.type === 'switch'"
                :value="fieldBool(field.key)"
                :disabled="isFieldDisabled(field)"
                @update:value="updateField(field.key, $event)"
              />
              <NDatePicker
                v-else-if="field.type === 'date'"
                type="date"
                :value="fieldNum(field.key)"
                :placeholder="field.placeholder"
                :disabled="isFieldDisabled(field)"
                :clearable="isFieldClearable(field)"
                style="width: 100%"
                @update:value="updateField(field.key, $event)"
              />
              <NDatePicker
                v-else-if="field.type === 'daterange'"
                type="daterange"
                :value="fieldDateRange(field.key)"
                :disabled="isFieldDisabled(field)"
                :clearable="isFieldClearable(field)"
                style="width: 100%"
                @update:value="updateField(field.key, $event)"
              />
              <RCheckButtonGroup
                v-else-if="field.type === 'button-group'"
                :model-value="fieldButtonGroupValue(field.key)"
                :options="resolvedOptions(field)"
                :multiple="!!field.buttonGroupMultiple"
                :disabled="isFieldDisabled(field)"
                :size="size"
                @update:model-value="updateField(field.key, $event)"
              />
              <RStorageIdField
                v-else-if="isUploadField(field)"
                :field="field"
                :model-value="model[field.key]"
                :disabled="isFieldDisabled(field)"
                :readonly="readonly"
                @update:model-value="updateField(field.key, $event)"
              />
              <RImageCropUpload
                v-else-if="field.type === 'image_crop_upload'"
                :model-value="fieldUploadArr(field.key)"
                :accept="field.accept || 'image/*'"
                :max-count="field.maxCount ?? 1"
                :max-size-m-b="field.maxSizeMB"
                :storage="field.storage"
                :business-id="field.businessId"
                :business-type="field.businessType"
                :action="field.action"
                :headers="field.headers"
                :with-credentials="field.withCredentials"
                :disabled="isFieldDisabled(field)"
                :readonly="readonly"
                v-bind="field.componentProps"
                @update:model-value="updateField(field.key, $event)"
              />
              <component
                :is="field.component"
                v-else-if="field.type === 'custom' && field.component"
                :model-value="model[field.key]"
                :field="field"
                :disabled="isFieldDisabled(field)"
                :readonly="readonly"
                v-bind="field.componentProps"
                v-on="customComponentListeners(field)"
              />
            </template>
            <slot name="fieldSuffix" :field="field" />
          </NFormItemGi>
        </NGrid>
      </div>
      <!-- Ungrouped fields -->
      <NGrid v-if="ungroupedFields.length > 0" :cols="cols" :x-gap="columnGap" :y-gap="rowGap">
        <NFormItemGi
          v-for="field in ungroupedFields"
          :key="field.key"
          :label="field.label"
          :path="field.key"
          :span="field.span ?? 1"
        >
          <slot name="fieldPrefix" :field="field" />
          <NInput
            v-if="field.type === 'input'"
            :value="fieldStr(field.key)"
            :type="field.inputType || 'text'"
            :placeholder="field.placeholder"
            :disabled="isFieldDisabled(field)"
            :readonly="readonly"
            :clearable="isFieldClearable(field)"
            @update:value="updateField(field.key, $event)"
          />
          <NSelect
            v-else-if="field.type === 'select'"
            :value="fieldStrNum(field.key)"
            :placeholder="field.placeholder"
            :disabled="isFieldDisabled(field)"
            :options="resolvedOptions(field)"
            :clearable="isFieldClearable(field)"
            @update:value="updateField(field.key, $event)"
          />
          <RStorageIdField
            v-else-if="isUploadField(field)"
            :field="field"
            :model-value="model[field.key]"
            :disabled="isFieldDisabled(field)"
            :readonly="readonly"
            @update:model-value="updateField(field.key, $event)"
          />
          <RImageCropUpload
            v-else-if="field.type === 'image_crop_upload'"
            :model-value="fieldUploadArr(field.key)"
            :accept="field.accept || 'image/*'"
            :max-count="field.maxCount ?? 1"
            :max-size-m-b="field.maxSizeMB"
            :storage="field.storage"
            :business-id="field.businessId"
            :business-type="field.businessType"
            :action="field.action"
            :headers="field.headers"
            :with-credentials="field.withCredentials"
            :disabled="isFieldDisabled(field)"
            :readonly="readonly"
            v-bind="field.componentProps"
            @update:model-value="updateField(field.key, $event)"
          />
          <slot name="fieldSuffix" :field="field" />
        </NFormItemGi>
      </NGrid>
    </template>

    <!-- Flat layout (default) -->
    <NGrid v-else :cols="cols" :x-gap="columnGap" :y-gap="rowGap">
      <NFormItemGi
        v-for="field in visibleFields"
        :key="field.key"
        :label="field.label"
        :path="field.key"
        :span="field.span ?? 1"
      >
        <slot name="fieldPrefix" :field="field" />
        <component :is="'span'" v-if="asyncLoadingMap[field.key]" class="r-form-async-hint"
          >Loading...</component
        >
        <template v-else>
          <NInput
            v-if="field.type === 'input'"
            :value="fieldStr(field.key)"
            :placeholder="field.placeholder"
            :disabled="isFieldDisabled(field)"
            :readonly="readonly"
            :clearable="isFieldClearable(field)"
            @update:value="updateField(field.key, $event)"
          />
          <RTextareaField
            v-else-if="field.type === 'textarea'"
            :field="field"
            :model-value="model[field.key]"
            :disabled="isFieldDisabled(field)"
            :readonly="readonly"
            :clearable="isFieldClearable(field)"
            @update:model-value="updateField(field.key, $event)"
          />
          <NInputNumber
            v-else-if="field.type === 'number'"
            :value="fieldNum(field.key)"
            :placeholder="field.placeholder"
            :disabled="isFieldDisabled(field)"
            :readonly="readonly"
            :clearable="isFieldClearable(field)"
            style="width: 100%"
            @update:value="updateField(field.key, $event)"
          />
          <NSelect
            v-else-if="field.type === 'select'"
            :value="fieldStrNum(field.key)"
            :placeholder="field.placeholder"
            :disabled="isFieldDisabled(field)"
            :options="resolvedOptions(field)"
            :clearable="isFieldClearable(field)"
            @update:value="updateField(field.key, $event)"
          />
          <NRadioGroup
            v-else-if="field.type === 'radio'"
            :value="fieldStrNum(field.key)"
            :disabled="isFieldDisabled(field)"
            @update:value="updateField(field.key, $event)"
          >
            <NRadio
              v-for="opt in field.options ?? []"
              :key="String(opt.value)"
              :value="toStrNum(opt.value)"
              :disabled="opt.disabled"
              >{{ opt.label }}</NRadio
            >
          </NRadioGroup>
          <NCheckboxGroup
            v-else-if="field.type === 'checkbox'"
            :value="fieldArr(field.key)"
            :disabled="isFieldDisabled(field)"
            @update:value="updateField(field.key, $event)"
          >
            <NCheckbox
              v-for="opt in field.options ?? []"
              :key="String(opt.value)"
              :value="toStrNum(opt.value)"
              :disabled="opt.disabled"
              :label="opt.label"
            />
          </NCheckboxGroup>
          <NSwitch
            v-else-if="field.type === 'switch'"
            :value="fieldBool(field.key)"
            :disabled="isFieldDisabled(field)"
            @update:value="updateField(field.key, $event)"
          />
          <NDatePicker
            v-else-if="field.type === 'date'"
            type="date"
            :value="fieldNum(field.key)"
            :placeholder="field.placeholder"
            :disabled="isFieldDisabled(field)"
            :clearable="isFieldClearable(field)"
            style="width: 100%"
            @update:value="updateField(field.key, $event)"
          />
          <NDatePicker
            v-else-if="field.type === 'daterange'"
            type="daterange"
            :value="fieldDateRange(field.key)"
            :disabled="isFieldDisabled(field)"
            :clearable="isFieldClearable(field)"
            style="width: 100%"
            @update:value="updateField(field.key, $event)"
          />
          <RCheckButtonGroup
            v-else-if="field.type === 'button-group'"
            :model-value="fieldButtonGroupValue(field.key)"
            :options="resolvedOptions(field)"
            :multiple="!!field.buttonGroupMultiple"
            :disabled="isFieldDisabled(field)"
            :size="size"
            @update:model-value="updateField(field.key, $event)"
          />
          <RStorageIdField
            v-else-if="isUploadField(field)"
            :field="field"
            :model-value="model[field.key]"
            :disabled="isFieldDisabled(field)"
            :readonly="readonly"
            @update:model-value="updateField(field.key, $event)"
          />
          <RImageCropUpload
            v-else-if="field.type === 'image_crop_upload'"
            :model-value="fieldUploadArr(field.key)"
            :accept="field.accept || 'image/*'"
            :max-count="field.maxCount ?? 1"
            :max-size-m-b="field.maxSizeMB"
            :storage="field.storage"
            :business-id="field.businessId"
            :business-type="field.businessType"
            :action="field.action"
            :headers="field.headers"
            :with-credentials="field.withCredentials"
            :disabled="isFieldDisabled(field)"
            :readonly="readonly"
            v-bind="field.componentProps"
            @update:model-value="updateField(field.key, $event)"
          />
          <component
            :is="field.component"
            v-else-if="field.type === 'custom' && field.component"
            :model-value="model[field.key]"
            :field="field"
            :disabled="isFieldDisabled(field)"
            :readonly="readonly"
            v-bind="field.componentProps"
            v-on="customComponentListeners(field)"
          />
        </template>
        <slot name="fieldSuffix" :field="field" />
      </NFormItemGi>
    </NGrid>

    <slot v-if="showActions" name="actions">
      <NSpace justify="end" style="margin-top: 16px">
        <NButton attr-type="button" @click="handleReset">重置</NButton>
        <NButton type="primary" attr-type="submit">提交</NButton>
      </NSpace>
    </slot>
  </NForm>
